# Render Blueprint — free Web Service (Docker).
# Deploy: https://dashboard.render.com → New → Blueprint → connect this repo.
# Or: New → Web Service → Docker → select this repo (uses Dockerfile).
services:
  - type: web
    name: strategy-backtester
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVE_FRONTEND
        value: "1"
      - key: STATIC_DIR
        value: /app/static
      # Free tier disks are ephemeral; SQLite resets on redeploy — fine for a public demo.
